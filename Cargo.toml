[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
rig = { version = "0.41.0", features = ["rmcp"] }
rmcp = { version = "2.2.0", features = ["transport-child-process"] }
anyhow = "1.0.104"
chrono = "0.4.45"
tokio = { version = "1.53.1", features = ["process"] }
futures = "0.3.33"
dotenvy = "0.15.7"
